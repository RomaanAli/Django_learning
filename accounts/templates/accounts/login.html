{% extends "base.html" %}

{% block title %}Login | E-Learning{% endblock %}

{% block content %}
    <div class="card form-panel">
        <h1>Login</h1>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn btn-primary" type="submit">Login</button>
        </form>

        <p class="form-footer">Don't have an account? <a href="{% url 'register' %}">Register here</a></p>
    </div>
{% endblock %}
