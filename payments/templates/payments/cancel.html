{% extends "base.html" %}

{% block title %}Payment cancelled | E-Learning{% endblock %}

{% block content %}
<div class="glass mx-auto w-full max-w-xl rounded-3xl border border-white/60 bg-white/70 p-6 text-center shadow-sm backdrop-blur sm:p-10">
    <div class="mx-auto flex h-20 w-20 items-center justify-center rounded-full bg-[#b64242]/10 text-4xl font-bold text-[#b64242]" aria-hidden="true">&#10006;</div>
    <h1 class="mt-6 text-3xl font-bold tracking-tight text-forest">Payment cancelled</h1>
    <p class="mt-3 text-forest/70">
        No money was taken and you were not charged. You can come back and
        try again whenever you are ready.
    </p>
    <div class="mt-8 flex flex-col gap-3 sm:flex-row sm:justify-center">
        <a class="inline-flex items-center justify-center rounded-xl bg-forest px-5 py-2.5 font-semibold text-white shadow-sm transition duration-200 hover:-translate-y-px hover:bg-[#183027] hover:shadow-md focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-forest" href="{% url 'payments:confirm' course.pk %}">Try again</a>
        <a class="inline-flex items-center justify-center rounded-xl border border-forest/20 bg-white/70 px-5 py-2.5 font-semibold text-forest backdrop-blur transition duration-200 hover:bg-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-forest" href="{% url 'course_detail' course.pk %}">Back to the course</a>
    </div>
</div>
{% endblock %}
